name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.5.0 or 0.5.0-rc.1)'
        required: true
        type: string
      release_name:
        description: 'Release title (optional, defaults to "Amethyst v<version>")'
        required: false
        type: string
      release_notes:
        description: 'Release notes / changelog (optional)'
        required: false
        type: string
      android_runner:
        description: 'Android Linux runner label (e.g. ubuntu-24.04 or android-release for a self-hosted runner)'
        required: false
        default: 'ubuntu-24.04'
        type: string

permissions:
  contents: write

env:
  NUCLEUS_REVISION: 6bcffd07c6e3a9c0e17558a098ef8b8c3c4a80b3

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            task: packageReleaseMsi
            artifact-dir: msi
            artifact-ext: msi
            artifact-name: amethyst-windows

          - os: macos-26
            name: macOS ARM
            task: packageReleaseDmg
            artifact-dir: dmg
            artifact-ext: dmg
            artifact-name: amethyst-macos-arm64

          - os: macos-15-intel
            name: macOS Intel
            task: packageReleaseDmg
            artifact-dir: dmg
            artifact-ext: dmg
            artifact-name: amethyst-macos-amd64

          - os: ubuntu-latest
            name: Linux DEB
            task: packageReleaseDeb
            artifact-dir: deb
            artifact-ext: deb
            artifact-name: amethyst-linux-deb

          - os: ubuntu-latest
            name: Linux Fedora RPM
            task: packageReleaseRpm
            artifact-dir: rpm
            artifact-ext: rpm
            artifact-name: amethyst-linux-fedora-rpm

          - os: ubuntu-latest
            name: Linux AppImage
            task: packageReleaseAppImage
            artifact-dir: AppImage
            artifact-ext: AppImage
            artifact-name: amethyst-linux-appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Nucleus fork
        uses: actions/checkout@v4
        with:
          repository: anthonyhfm/Nucleus
          ref: ${{ env.NUCLEUS_REVISION }}
          path: Nucleus
          persist-credentials: false

      - name: Fetch ML Graphics
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ML_GRAPHICS_REPOSITORY }}
          token: ${{ secrets.ML_GRAPHICS_TOKEN }}
          path: ml3-graphics
          sparse-checkout: launchpad

      - name: Copy ML Graphics
        shell: bash
        run: mkdir -p composeApp/src/commonMain/composeResources/files && cp -r ml3-graphics/. composeApp/src/commonMain/composeResources/files/

      - name: Setup Nucleus
        # The following upstream commit switched JVM packaging from JBR to
        # Temurin/Microsoft JDKs, which currently makes jlink fail on macOS and
        # Linux. Keep the last known-good JBR-based setup immutable.
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@bc084b45920b36174de76115370c87f436bcc6cb
        with:
          packaging-tools: 'true'
          setup-gradle: 'true'
          setup-node: 'true'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup stem runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes build-essential libasound2-dev libdbus-1-dev libglib2.0-dev libgtk-3-dev libx11-dev pkg-config rpm

      - name: Test and build
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew :composeApp:desktopTest :composeApp:${{ matrix.task }} -Pamethyst.nucleus.path=Nucleus -Pamethyst.native.variant=release -Pamethyst.stems.python=python

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p "composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}"
          src=$(find composeApp/build/compose/binaries/main-release -name "*.${{ matrix.artifact-ext }}" -type f | head -1)
          if [ -z "$src" ]; then
            echo "ERROR: No .${{ matrix.artifact-ext }} file found in build output!"
            find composeApp/build/compose/binaries/main-release -type f
            exit 1
          fi
          dst="composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}/${{ matrix.artifact-name }}-${{ inputs.version }}.${{ matrix.artifact-ext }}"
          mv "$src" "$dst"
          echo "Renamed: $src → $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact-name }}
          path: composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}/${{ matrix.artifact-name }}-${{ inputs.version }}.${{ matrix.artifact-ext }}
          if-no-files-found: error

  android:
    name: Build (Android)
    runs-on: ${{ inputs.android_runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Nucleus fork
        uses: actions/checkout@v4
        with:
          repository: anthonyhfm/Nucleus
          ref: ${{ env.NUCLEUS_REVISION }}
          path: Nucleus
          persist-credentials: false

      - name: Fetch ML Graphics
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ML_GRAPHICS_REPOSITORY }}
          token: ${{ secrets.ML_GRAPHICS_TOKEN }}
          path: ml3-graphics
          sparse-checkout: launchpad

      - name: Copy ML Graphics
        shell: bash
        run: mkdir -p composeApp/src/commonMain/composeResources/files && cp -r ml3-graphics/. composeApp/src/commonMain/composeResources/files/

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes build-essential libasound2-dev pkg-config

      - name: Build Android release
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pamethyst.nucleus.path=Nucleus \
            -Pamethyst.native.variant=release \
            "-Pamethyst.android.versionName=$RELEASE_VERSION" \
            "-Pamethyst.android.versionCode=$ANDROID_VERSION_CODE"

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub secret: $secret"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/amethyst-release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p android-release
          apk="android-release/amethyst-android-$RELEASE_VERSION.apk"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/zipalign" -P 16 -f 4 \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            "$RUNNER_TEMP/amethyst-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" \
            "$RUNNER_TEMP/amethyst-aligned.apk"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-amethyst-android
          path: android-release/*.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-assets-*

      - name: Generate update YML
        uses: kdroidFilter/Nucleus/.github/actions/generate-update-yml@main
        with:
          artifacts-path: release-artifacts
          version: ${{ inputs.version }}
          channel: ${{ contains(inputs.version, '-rc') && 'rc' || 'latest' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.release_name || format('Amethyst v{0}', inputs.version) }}
          prerelease: ${{ contains(inputs.version, '-rc') }}
          body: |
            ${{ inputs.release_notes }}

            **Build #${{ github.run_number }}** · Commit: `${{ github.sha }}` · @${{ github.actor }}
          files: |
            release-artifacts/release-assets-amethyst-windows/*.msi
            release-artifacts/release-assets-amethyst-macos-arm64/*.dmg
            release-artifacts/release-assets-amethyst-macos-amd64/*.dmg
            release-artifacts/release-assets-amethyst-linux-deb/*.deb
            release-artifacts/release-assets-amethyst-linux-fedora-rpm/*.rpm
            release-artifacts/release-assets-amethyst-linux-appimage/*.AppImage
            release-artifacts/release-assets-amethyst-android/*.apk
            release-artifacts/update-yml/*.yml
          fail_on_unmatched_files: false
