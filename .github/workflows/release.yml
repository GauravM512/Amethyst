name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.5.0 or 0.5.0-rc.1)'
        required: true
        type: string
      release_name:
        description: 'Release title (optional, defaults to "Amethyst v<version>")'
        required: false
        type: string
      release_notes:
        description: 'Release notes / changelog (optional)'
        required: false
        type: string
      android_runner:
        description: 'Android Linux runner label (e.g. ubuntu-24.04 or android-release for a self-hosted runner)'
        required: false
        default: 'ubuntu-24.04'
        type: string
      reuse_run_id:
        description: 'Reuse Linux and Android artifacts from this run; rebuild Windows and both macOS variants'
        required: false
        type: string
      skip_tests:
        description: 'Skip desktop tests before building'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NUCLEUS_REVISION: 6bcffd07c6e3a9c0e17558a098ef8b8c3c4a80b3

jobs:
  prepare:
    name: Select builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify reusable artifacts
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts" > "$RUNNER_TEMP/reusable-artifacts.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = json.loads((Path(os.environ["RUNNER_TEMP"]) / "reusable-artifacts.json").read_text())
          available = {artifact["name"] for artifact in artifacts["artifacts"] if not artifact["expired"]}
          required = {
              "release-assets-amethyst-linux-deb",
              "release-assets-amethyst-linux-fedora-rpm",
              "release-assets-amethyst-linux-appimage",
              "release-assets-amethyst-android",
          }
          missing = required - available
          if missing:
              raise SystemExit(f"Missing reusable artifacts: {', '.join(sorted(missing))}")
          PY

      - name: Select build matrix
        id: matrix
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path(".github/release-matrix.json").read_text())
          if os.environ["REUSE_RUN_ID"]:
              matrix["include"] = [entry for entry in matrix["include"] if entry["os"].startswith(("windows-", "macos-"))]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          PY

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Nucleus fork
        uses: actions/checkout@v4
        with:
          repository: anthonyhfm/Nucleus
          ref: ${{ env.NUCLEUS_REVISION }}
          path: Nucleus
          persist-credentials: false

      - name: Fetch ML Graphics
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ML_GRAPHICS_REPOSITORY }}
          token: ${{ secrets.ML_GRAPHICS_TOKEN }}
          path: ml3-graphics
          sparse-checkout: launchpad

      - name: Copy ML Graphics
        shell: bash
        run: mkdir -p composeApp/src/commonMain/composeResources/files && cp -r ml3-graphics/. composeApp/src/commonMain/composeResources/files/

      - name: Setup Nucleus
        # The following upstream commit switched JVM packaging from JBR to
        # Temurin/Microsoft JDKs, which currently makes jlink fail on macOS and
        # Linux. Keep the last known-good JBR-based setup immutable.
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@bc084b45920b36174de76115370c87f436bcc6cb
        with:
          packaging-tools: 'true'
          setup-gradle: 'true'
          setup-node: 'true'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup stem runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes build-essential libasound2-dev libdbus-1-dev libglib2.0-dev libgtk-3-dev libx11-dev pkg-config rpm

      - name: Test and build
        if: runner.os != 'Windows'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            ./gradlew :composeApp:${{ matrix.task }} -Pamethyst.nucleus.path=Nucleus -Pamethyst.native.variant=release -Pamethyst.stems.python=python -x desktopTest
          else
            ./gradlew :composeApp:desktopTest :composeApp:${{ matrix.task }} -Pamethyst.nucleus.path=Nucleus -Pamethyst.native.variant=release -Pamethyst.stems.python=python
          fi

      - name: Test and build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if ("${{ inputs.skip_tests }}" -eq "true") {
            ./gradlew.bat :composeApp:${{ matrix.task }} '-Pamethyst.nucleus.path=Nucleus' '-Pamethyst.native.variant=release' '-Pamethyst.stems.python=python' -x desktopTest
          } else {
            ./gradlew.bat :composeApp:desktopTest :composeApp:${{ matrix.task }} '-Pamethyst.nucleus.path=Nucleus' '-Pamethyst.native.variant=release' '-Pamethyst.stems.python=python'
          }

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p "composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}"
          src=$(find composeApp/build/compose/binaries/main-release -name "*.${{ matrix.artifact-ext }}" -type f | head -1)
          if [ -z "$src" ]; then
            echo "ERROR: No .${{ matrix.artifact-ext }} file found in build output!"
            find composeApp/build/compose/binaries/main-release -type f
            exit 1
          fi
          dst="composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}/${{ matrix.artifact-name }}-${{ inputs.version }}.${{ matrix.artifact-ext }}"
          mv "$src" "$dst"
          echo "Renamed: $src → $dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact-name }}
          path: composeApp/build/compose/binaries/main-release/${{ matrix.artifact-dir }}/${{ matrix.artifact-name }}-${{ inputs.version }}.${{ matrix.artifact-ext }}
          if-no-files-found: error

  android:
    name: Build (Android)
    if: inputs.reuse_run_id == ''
    runs-on: ${{ inputs.android_runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_BUILD_TOOLS_VERSION: '37.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Nucleus fork
        uses: actions/checkout@v4
        with:
          repository: anthonyhfm/Nucleus
          ref: ${{ env.NUCLEUS_REVISION }}
          path: Nucleus
          persist-credentials: false

      - name: Fetch ML Graphics
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.ML_GRAPHICS_REPOSITORY }}
          token: ${{ secrets.ML_GRAPHICS_TOKEN }}
          path: ml3-graphics
          sparse-checkout: launchpad

      - name: Copy ML Graphics
        shell: bash
        run: mkdir -p composeApp/src/commonMain/composeResources/files && cp -r ml3-graphics/. composeApp/src/commonMain/composeResources/files/

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes build-essential libasound2-dev pkg-config

      - name: Stage Android native libraries
        shell: bash
        run: |
          ./gradlew \
            :nativeEngine:copyAndroidAndroidArm64Release \
            :nativeEngine:copyAndroidAndroidArmV7Release \
            :nativeEngine:copyAndroidAndroidX64Release \
            :nativeEngine:copyAndroidAndroidX86Release \
            -Pamethyst.nucleus.path=Nucleus \
            -Pamethyst.native.variant=release \
            --no-configuration-cache

      - name: Build Android release
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pamethyst.nucleus.path=Nucleus \
            -Pamethyst.native.variant=release \
            "-Pamethyst.android.versionName=$RELEASE_VERSION" \
            "-Pamethyst.android.versionCode=$ANDROID_VERSION_CODE" \
            --no-configuration-cache

      - name: Verify Android native engine
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from zipfile import ZipFile

          apk = "composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk"
          with ZipFile(apk) as archive:
              for abi in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86"):
                  for library in ("libamethyst_native_engine.so", "libc++_shared.so"):
                      entry = f"lib/{abi}/{library}"
                      if archive.getinfo(entry).file_size == 0:
                          raise SystemExit(f"Empty native library: {entry}")
                      print(f"Verified {entry}")
                  if f"lib/{abi}/libaaudio.so" in archive.namelist():
                      raise SystemExit("The Android system AAudio library must not be bundled")
          PYTHON

      - name: Verify JNA release bindings
        shell: bash
        run: |
          python3 .github/scripts/verify-android-jna.py \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/dexdump"

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing GitHub secret: $secret"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/amethyst-release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p android-release
          apk="android-release/amethyst-android-$RELEASE_VERSION.apk"
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          "$tools/zipalign" -P 16 -f 4 \
            composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
            "$RUNNER_TEMP/amethyst-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" \
            "$RUNNER_TEMP/amethyst-aligned.apk"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-amethyst-android
          path: android-release/*.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.android.result == 'success' || (inputs.reuse_run_id != '' && needs.android.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-assets-*

      - name: Download existing Linux artifacts
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          path: release-artifacts
          pattern: release-assets-amethyst-linux-*

      - name: Download existing Android artifact
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          name: release-assets-amethyst-android
          path: release-artifacts/release-assets-amethyst-android

      - name: Verify release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          assets = {
              "amethyst-windows": "msi",
              "amethyst-macos-arm64": "dmg",
              "amethyst-macos-amd64": "dmg",
              "amethyst-linux-deb": "deb",
              "amethyst-linux-fedora-rpm": "rpm",
              "amethyst-linux-appimage": "AppImage",
              "amethyst-android": "apk",
          }
          version = os.environ["RELEASE_VERSION"]
          root = Path("release-artifacts")
          missing = [
              f"{name}-{version}.{extension}"
              for name, extension in assets.items()
              if not (root / f"release-assets-{name}" / f"{name}-{version}.{extension}").is_file()
          ]
          if missing:
              raise SystemExit(f"Missing release assets for version {version}: {', '.join(missing)}")
          PY

      - name: Generate update YML
        uses: kdroidFilter/Nucleus/.github/actions/generate-update-yml@main
        with:
          artifacts-path: release-artifacts
          version: ${{ inputs.version }}
          channel: ${{ contains(inputs.version, '-rc') && 'rc' || 'latest' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || format('Amethyst v{0}', inputs.version) }}
          prerelease: ${{ contains(inputs.version, '-rc') }}
          body: |
            ${{ inputs.release_notes }}

            **Build #${{ github.run_number }}** · Commit: `${{ github.sha }}` · @${{ github.actor }}
          files: |
            release-artifacts/release-assets-amethyst-windows/*.msi
            release-artifacts/release-assets-amethyst-macos-arm64/*.dmg
            release-artifacts/release-assets-amethyst-macos-amd64/*.dmg
            release-artifacts/release-assets-amethyst-linux-deb/*.deb
            release-artifacts/release-assets-amethyst-linux-fedora-rpm/*.rpm
            release-artifacts/release-assets-amethyst-linux-appimage/*.AppImage
            release-artifacts/release-assets-amethyst-android/*.apk
            release-artifacts/update-yml/*.yml
          fail_on_unmatched_files: false
